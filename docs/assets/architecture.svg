<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura do ClimateLab — fluxo atual e evolução planejada</title>
<desc id="desc">Fluxo atual: os CSVs originais do INMET são selecionados por estação e ano com DataPaths.csv_path e explorados com pandas e ColumnName no notebook. Fluxo planejado: integrar reanálise Open-Meteo/ERA5, verificar qualidade e cobertura, alinhar horários e unidades, calcular indicadores e comparar fontes, salvando tabelas e gráficos. Bordas e setas contínuas indicam o disponível; pontilhadas indicam o planejado.</desc>
