<title id="title">ClimateLab — laboratório de dados meteorológicos</title>
<desc id="desc">Capa do laboratório ClimateLab. Do CSV à investigação ambiental, com Python, pandas e observações do INMET. Ilustração de clima e de uma série temporal, sem representar resultados calculados.</desc>
